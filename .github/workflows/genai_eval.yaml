name: Sample Evaluate Action 
on: 
  workflow_call: 
  workflow_dispatch: 

permissions: 
  id-token: write 
  contents: read 

jobs: 
  evaluate: 
    runs-on: ubuntu-latest 
    environment:
      name: dev
    env: 
      GENAI_EVALS_CONFIG_PATH:  ${{ github.workspace }}/evaluate-config.json  
      GENAI_EVALS_DATA_PATH: ${{ github.workspace }}/.github/.test_files/eval-input.jsonl 
      AZURE_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      AZURE_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
      AZURE_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
    #   APP_CONFIG_ENDPOINT:   ${{ vars.APP_CONFIG_ENDPOINT }}
    steps: 
      - uses: actions/checkout@v4 
      - uses: azure/login@v2 
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Write evaluate config 
        run: |
          echo '{ 
            "data": "${{ env.GENAI_EVALS_DATA_PATH }}", 
            "evaluators": { 
              "coherence": "CoherenceEvaluator", 
              "fluency": "FluencyEvaluator" 
            }, 
            "ai_model_configuration": { 
              "type": "azure_openai", 
              "azure_endpoint": "https://ca-iyoddfg4lffc4-orchestrator.happywave-ca8f874a.eastus2.azurecontainerapps.io/orchestrator", 
              "azure_deployment": "gpt-4.1", 
              "api_key": "${{ secrets.AZURE_OPENAI_API_KEY }}", 
              "api_version": "2024-12-01-preview" 
            } 
          }' > ${{ env.GENAI_EVALS_CONFIG_PATH }}      
      - name: Debug - Check repository structure
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Repository root contents:"
          ls -la
          echo ""
          echo "Check if .github exists:"
          ls -la .github/ || echo ".github directory not found"
          echo ""
          echo "Check if .github/.test_files exists:"
          ls -la .github/.test_files/ || echo ".github/.test_files directory not found"
          echo ""
          echo "Find all .jsonl files:"
          find . -name "*.jsonl" -type f
          echo ""
          echo "Find eval-input.jsonl specifically:"
          find . -name "eval-input.jsonl" -type f || echo "eval-input.jsonl not found"
      
      - uses: azure/login@v2 
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
