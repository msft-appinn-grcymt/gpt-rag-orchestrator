name: Sample Evaluate Action 
on: 
  workflow_call: 
  workflow_dispatch: 

permissions: 
  id-token: write 
  contents: read 

jobs: 
  evaluate: 
    runs-on: ubuntu-latest 
    environment:
      name: dev
    env: 
      GENAI_EVALS_CONFIG_PATH: ${{ github.workspace }}/evaluate-config.json 
      GENAI_EVALS_DATA_PATH: ${{ github.workspace }}/dataset/golden-dataset.jsonl 
      AZURE_CLIENT_SECRET:   ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      AZURE_TENANT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
      AZURE_CLIENT_ID:       ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
    steps: 
      - uses: actions/checkout@v4 
      - uses: azure/login@v2 
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Write evaluate config 
        run: | 
          cat > ${{ env.GENAI_EVALS_CONFIG_PATH }} <<'EOF'
          { 
            "data": "$GENAI_EVALS_DATA_PATH", 
            "evaluators": { 
              "coherence": "CoherenceEvaluator", 
              "fluency": "FluencyEvaluator" 
            }, 
            "ai_model_configuration": { 
              "type": "azure_openai", 
              "azure_endpoint": "https://ca-iyoddfg4lffc4-orchestrator.happywave-ca8f874a.eastus2.azurecontainerapps.io/orchestrator", 
              "azure_deployment": "gpt-4.1", 
              "api_key": "ENV:AZURE_OPENAI_API_KEY", 
              "api_version": "2024-12-01-preview" 
            } 
          } 
          EOF
          # Substitute environment variables
          envsubst < ${{ env.GENAI_EVALS_CONFIG_PATH }} > temp.json && mv temp.json ${{ env.GENAI_EVALS_CONFIG_PATH }}
      - name: Run AI Evaluation 
        id: run-ai-evaluation 
        uses: microsoft/genai-evals@main 
        with: 
          evaluate-configuration: ${{ env.GENAI_EVALS_CONFIG_PATH }}